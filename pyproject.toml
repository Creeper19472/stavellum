[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stavellum"
version = "0.1.0"
description = "Automatic music notation and presentation from supported music formats"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*", "src/stavellum/fonts/*LICENSE.txt"]
authors = [{ name = "Creeper19472" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.14,<3.15"
dependencies = [
  "PySide6==6.11.2",
  "pyflp==2.2.1",
  "mido>=1.3,<2",
  "music21>=9.7,<10",
  "verovio>=5.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12", "pypdf>=6"]

[project.scripts]
stavellum = "stavellum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stavellum"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/stavellum", "native/rhi", "native/rust-renderer", "native/rust-core", ".cargo/config.toml", "Cargo.toml", "Cargo.lock", "hatch_build.py", "pyproject.toml", "uv.lock", "README.md", "README-zh.md", "LICENSE", "LICENSES", "THIRD_PARTY_NOTICES.md", "run.ps1", "tests", "docs", "scripts"]
artifacts = ["src/stavellum/native/rhi/stavellum_rust.dll", "src/stavellum/native/rhi/stavellum_rhi.dll", "src/stavellum/native/rhi/quad.vert.qsb", "src/stavellum/native/rhi/quad.frag.qsb", "src/stavellum/native/core/stavellum_core.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: external renderer and encoder checks", "slow: five-minute video export"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
